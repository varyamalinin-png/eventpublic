# Подключить на VM после переноса на iwent.ru: редирект со старого домена.
# Включение: sudo ln -sf /etc/nginx/sites-available/legacy-iventapp-redirect /etc/nginx/sites-enabled/
# Затем: sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат для iventapp.ru оставьте (certbot -d iventapp.ru -d www.iventapp.ru), иначе браузер ругнётся до редиректа.

server {
    listen 80;
    server_name iventapp.ru www.iventapp.ru;
    return 301 https://iwent.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name iventapp.ru www.iventapp.ru;

    ssl_certificate /etc/letsencrypt/live/iventapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iventapp.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://iwent.ru$request_uri;
}
