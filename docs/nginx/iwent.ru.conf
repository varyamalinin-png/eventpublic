# iwent: веб-приложение на 3000, API на 4000.
# Список префиксов API повторяет старый сервер (CLAUDE.md §2.1.1): всё, чего
# нет в этом списке, уходит в Next.js и возвращается его HTML-страницей 404.

upstream iwent_api { server 127.0.0.1:4000; keepalive 16; }
upstream iwent_web { server 127.0.0.1:3000; keepalive 16; }

server {
    server_name iwent.ru www.iwent.ru _;

    client_max_body_size 25m;

    # Запросы, которых в этом приложении не существует по определению: php,
    # dotfiles, типовые цели сканеров WordPress. До 24.10.2026 они уходили в
    # location / , то есть в Next.js, и он на каждый такой зонд рисовал
    # React-страницу 404 на 18 КБ (а на часть отвечал 500). Это 12 346 запросов
    # из 41 122 за две недели — почти треть всего трафика.
    #
    # 444 — ответ nginx «закрыть соединение молча», самый дешёвый из возможных.
    # access_log off, чтобы журнал оставался читаемым: именно по нему мы смотрим
    # регистрации и ошибки.
    location ~* \.(?:php[0-9]?|phtml|phar|asp|aspx|jsp|cgi|pl|bak|old|sql|swp)$ {
        access_log off;
        return 444;
    }

    # /.env, /.git/config, /.aws/credentials и сотня их вариантов.
    # Исключение — /.well-known/: через него работают универсальные ссылки
    # (apple-app-site-association) и проверка домена certbot.
    location ~ /\.(?!well-known) {
        access_log off;
        return 444;
    }

    location ~* ^/(?:wp-admin|wp-content|wp-includes|wp-login|xmlrpc|vendor|phpmyadmin|pma|adminer|cgi-bin)(?:/|$) {
        access_log off;
        return 444;
    }

    # Сокеты для живых обновлений: чат, заявки, уведомления.
    location ^~ /socket.io/ {
        proxy_pass http://iwent_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # /api/<путь> это тот же бэкенд: префикс срезается слэшем в proxy_pass.
    location ^~ /api/ {
        proxy_pass http://iwent_api/;
        proxy_http_version 1.1;
        # RN/iOS clients used by the current App Store build don't handle
        # conditional API responses: a cached GET can return 304 with no JSON
        # body and the app then renders an empty feed. Always let the API send
        # the current representation.
        proxy_set_header If-None-Match "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Префиксы, которые обслуживает NestJS.
    location ~ ^/(auth|admin|events|event-folders|event-profiles|users|user-folders|chats|friends|folders|complaints|moderation|search|statistics|notifications|storage|health|vk)(/|$) {
        proxy_pass http://iwent_api;
        proxy_http_version 1.1;
        # See /api/: older native clients treat a bodyless 304 as a failed API
        # request. Remove the validator so the client always receives JSON.
        proxy_set_header If-None-Match "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Файл для универсальных ссылок должен отдаваться как JSON.
    location = /.well-known/apple-app-site-association {
        proxy_pass http://iwent_web;
        proxy_set_header Host $host;
        default_type application/json;
    }

    # Всё остальное — веб-приложение.
    location / {
        # Заголовки безопасности. На API их уже ставит helmet (server/src/main.ts),
        # а веб-страницы Next.js не отдавали ни одного — ставим здесь.
        # X-Frame-Options запрещает встраивать сайт в чужой iframe. Если у
        # VK mini app когда-нибудь появится фронтенд на iwent.ru, эту строку
        # придётся заменить на Content-Security-Policy с frame-ancestors vk.com.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://iwent_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/iwent.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/iwent.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.iwent.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = iwent.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name iwent.ru www.iwent.ru _;
    return 404; # managed by Certbot




}
