# Общие настройки безопасности для всех server-блоков.
# На машине лежит как /etc/nginx/conf.d/00-hardening.conf
# (включается из http {} строкой include /etc/nginx/conf.d/*.conf).
#
# Отдельный файл, а не правка /etc/nginx/nginx.conf, по одной причине:
# nginx.conf принадлежит пакету nginx-common, и его изменение при каждом
# apt upgrade вызывает вопрос «оставить вашу версию или взять новую».
# conf.d пакет не трогает.

# Версия nginx больше не уходит в заголовок Server и на страницы ошибок.
# Это не «защита» сама по себе — дыру это не закрывает. Но массовые сканеры
# после публикации свежей CVE отбирают цели именно по этой строке, и смысла
# добровольно сообщать её нет.
server_tokens off;
